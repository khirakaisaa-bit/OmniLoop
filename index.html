<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omniloop: practice between live sessions</title>
<meta name="description" content="Omniloop helps language teachers keep students practising between live sessions: daily tasks, mood check-ins and a weekly report that prepares the lesson.">
<style>
:root{
  --bg:#f4f7f7;--card:#ffffff;--ink:#14282d;--mute:#5d7378;--line:#dfe8e9;
  --side:#0f4c5c;--side-ink:#d7ebee;--side-act:#ffffff;--side-act-ink:#0f4c5c;
  --brand:#0f4c5c;--accent:#e8a33d;--accent-soft:#fdf1da;
  --ok:#2c8c63;--ok-soft:#e2f4ec;--warn:#b86e12;--warn-soft:#fdf0dc;--bad:#b9443d;--bad-soft:#fae6e4;
  --rail:#eef3f3;--shadow:0 1px 2px rgba(15,60,70,.06),0 4px 14px rgba(15,60,70,.05);
}
:root[data-theme="dark"]{
  --bg:#0d1517;--card:#162124;--ink:#e6f0f1;--mute:#93aab0;--line:#26363a;
  --side:#08100f;--side-ink:#a9c3c8;--side-act:#e8a33d;--side-act-ink:#1b1305;
  --brand:#7cc4d0;--accent:#e8a33d;--accent-soft:#2b2312;
  --ok:#55c08f;--ok-soft:#14302a;--warn:#e3a04a;--warn-soft:#2f2515;--bad:#e5837c;--bad-soft:#35201f;
  --rail:#111b1d;--shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1517;--card:#162124;--ink:#e6f0f1;--mute:#93aab0;--line:#26363a;
    --side:#08100f;--side-ink:#a9c3c8;--side-act:#e8a33d;--side-act-ink:#1b1305;
    --brand:#7cc4d0;--accent:#e8a33d;--accent-soft:#2b2312;
    --ok:#55c08f;--ok-soft:#14302a;--warn:#e3a04a;--warn-soft:#2f2515;--bad:#e5837c;--bad-soft:#35201f;
    --rail:#111b1d;--shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:26px;line-height:1.2;letter-spacing:-.01em}
h2{font-size:17px;line-height:1.3}
h3{font-size:15px}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* landing */
.land{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;gap:28px;text-align:center}
.brandbig{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;color:var(--brand)}
.land h1{max-width:640px;font-size:34px}
.land .lead{max-width:560px;color:var(--mute);font-size:17px}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,280px));gap:16px;width:100%;justify-content:center}
.door{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.door:hover,.door:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.door b{font-size:18px}
.door span{color:var(--mute);font-size:14px}
.door .go{margin-top:10px;color:var(--brand);font-weight:600}
.fine{max-width:560px;color:var(--mute);font-size:13px}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 316px;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:700;font-size:19px;padding:0 8px}
:root[data-theme="dark"] .brand{color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:inherit;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--side-act);color:var(--side-act-ink);font-weight:600}
.nav .tag{margin-left:auto;font-size:11px;opacity:.8}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.who{border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.35}
.who b{display:block;color:#fff}
:root[data-theme="dark"] .who b{color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:10px}
.seg button{border:0;border-radius:7px;padding:7px;background:transparent;color:inherit;display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px}
.seg button.on{background:var(--accent);color:#1b1305;font-weight:600}
.linkbtn{background:transparent;border:0;color:inherit;display:flex;gap:8px;align-items:center;padding:6px 4px;font-size:13px;opacity:.9;text-align:left}
.linkbtn:hover{opacity:1;text-decoration:underline}

.main{padding:28px 28px 48px;min-width:0;display:flex;flex-direction:column;gap:20px}
.rail{background:var(--rail);padding:28px 18px 40px;display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--line)}
.rail h2{font-size:18px}
.page-h{display:flex;flex-direction:column;gap:4px}
.sub{color:var(--mute)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card.sm{padding:14px}
.card h2{margin-bottom:10px}
.banner{background:var(--brand);color:#fff;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
:root[data-theme="dark"] .banner{background:#1b4650}
.banner h1{color:#fff}
.banner p{color:#d4ebee}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1305}
.btn.ghost{background:transparent;color:inherit;border-color:rgba(255,255,255,.4)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{color:var(--mute);font-size:13px}
.stat small{display:block;color:var(--mute);font-size:12px;margin-top:2px}

.bar{height:9px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
:root[data-theme="dark"] .bar i{background:#4fa5b3}
.bar.ok i{background:var(--ok)}
.lines{display:flex;flex-direction:column;gap:12px}
.line{display:grid;grid-template-columns:110px minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:14px}
.line .n{font-weight:600}
.line .t{color:var(--mute);font-size:13px;text-align:right}
.line.quiet .n:after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:6px}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line);color:var(--mute);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--warn)}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;background:var(--warn-soft);color:var(--warn);font-weight:600;margin-right:4px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.rowbtn{background:none;border:0;padding:0;font-weight:600;color:var(--brand);text-align:left}
:root[data-theme="dark"] .rowbtn{color:var(--accent)}
.rowbtn:hover{text-decoration:underline}
.scroll{overflow-x:auto}

.dots{display:inline-flex;gap:4px}
.dot{width:18px;height:18px;border-radius:5px;background:var(--line);font-size:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--mute);font-weight:700}
.dot.f{background:var(--ok);color:#fff}
.dot.t{background:var(--accent);color:#1b1305}
.dot.m{background:transparent;border:2px solid var(--bad);color:var(--bad)}
.dot.r{background:transparent;border:1px dashed var(--mute)}
.dot.l{background:var(--brand);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:10px}
.legend .dot{width:14px;height:14px;vertical-align:-3px;margin-right:4px}

.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;font-size:12px;background:var(--card)}
.wd b{display:block;font-size:13px}
.wd.now{border-color:var(--accent);background:var(--accent-soft)}
.wd span{color:var(--mute)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.item.focus{border-left:4px solid var(--accent)}
.item.brief{border-left:4px solid var(--ok)}
.item h3{margin-bottom:3px}
.quote{font-style:italic;color:var(--mute);font-size:14px}
.note{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
.mutebox{color:var(--mute);font-size:13px}
textarea.draft{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--bg);resize:vertical}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.switch{position:relative;width:44px;height:25px;border-radius:99px;border:0;background:var(--line);padding:0;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on{background:var(--ok)}
.switch.on:after{transform:translateX(19px)}
.agent{display:flex;gap:14px;align-items:flex-start}
.agent .ico{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--warn);display:flex;align-items:center;justify-content:center;flex:none}
.agent .grow{flex:1;min-width:0}
.log{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.log div{display:flex;gap:8px}
.log b{white-space:nowrap}
.locked{opacity:.75;position:relative}
.locked .lk{position:absolute;top:12px;right:12px;color:var(--mute)}
.course-w{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.course-w:last-child{border-bottom:0}
.wn{width:44px;height:44px;border-radius:12px;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700}
.course-w.cur .wn{background:var(--accent);color:#1b1305}
.course-w.done .wn{background:var(--ok-soft);color:var(--ok)}
.tasklist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.task{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg)}
.task b{color:var(--brand)}
:root[data-theme="dark"] .task b{color:var(--accent)}
.back{background:none;border:0;color:var(--brand);font-weight:600;padding:0;display:inline-flex;gap:4px;align-items:center}
:root[data-theme="dark"] .back{color:var(--accent)}
.democlock{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px dashed var(--mute);border-radius:12px;padding:10px 12px;font-size:13px}
.democlock b{display:block}
.hide{display:none!important}
.video{display:flex;gap:12px;align-items:center;margin-top:12px;border-radius:12px;background:var(--brand);color:#fff;padding:14px}
:root[data-theme="dark"] .video{background:#1b4650}
.video span{display:block;color:#d4ebee;font-size:13px}
.play{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#1b1305;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
details.tr{margin-top:8px;font-size:14px}
details.tr summary{cursor:pointer;color:var(--brand);font-weight:600}
:root[data-theme="dark"] details.tr summary{color:var(--accent)}
details.tr p{margin-top:6px;color:var(--mute)}
.inp{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);font:inherit;color:inherit}
label{font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25)}

@media (max-width:1180px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .rail{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .rail>.democlock,.rail>.wide{grid-column:1 / -1}
}
@media (max-width:860px){
  .app{display:block}
  .side{position:sticky;top:0;z-index:5;height:auto;flex-direction:column;padding:10px 12px;gap:8px}
  .side .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .side .nav button{white-space:nowrap;padding:8px 11px}
  .sidefoot{flex-direction:row;align-items:center;margin-top:0;gap:8px;flex-wrap:wrap}
  .who{display:none}
  .seg{width:150px}
  .main{padding:18px 16px 28px}
  .rail{display:flex;padding:18px 16px 40px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hm{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .doors{grid-template-columns:1fr}
  .line{grid-template-columns:84px minmax(0,1fr)}
  .line .t{grid-column:1 / -1;text-align:left;margin-top:-6px}
  h1{font-size:22px}
  .land h1{font-size:26px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hide" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

/* ---------- course data (Business English B1, sample written in advance) ---------- */
var COURSE={title:'Business English',level:'B1',weeks:[
 {n:1,title:'Making polite requests',obj:'Ask for things, permission and help politely at work.'},
 {n:2,title:'Writing short, clear work emails',obj:'Write a short email with a clear purpose, greeting and closing.'},
 {n:3,title:'Apologising and explaining a problem',obj:'Apologise for a delay or mistake, explain what happened and offer a solution.'},
 {n:4,title:'Meetings: agreeing and disagreeing politely',obj:'Give an opinion, agree and disagree politely in a meeting.'},
 {n:5,title:'Calls and video calls',obj:'Clarify what you heard and check understanding on a call.'},
 {n:6,title:'Making suggestions and giving advice',obj:'Suggest ideas and give advice to colleagues.'},
 {n:7,title:'Negotiating deadlines and tasks',obj:'Agree on deadlines, ask for more time and share out tasks.'},
 {n:8,title:'Giving a short update or presentation',obj:'Give a clear two-minute update on your work.'}
]};
var CUR=3, TOTAL_TASKS=32;
/* Set this to the web address of the feedback Worker to switch on the real AI agent. Empty means the simple demo rules. */
var AI_URL='https://omniloop-feedback.khira-k-aisaa.workers.dev/';
var TASKS=[
 {n:1,day:1,title:'Apology phrases',short:'Write one sentence apologising to a colleague for something small (a late reply, a mistake, a missed call).',long:'Write 2 to 3 sentences: apologise for something small, then say what you will do.',
  tr:'A clear apology starts with "I am sorry for" or "I apologise for", followed by a noun or an -ing form: "I am sorry for the late reply." "I apologise for missing your call."',fu:'Rewrite your sentence and add what you will do.'},
 {n:2,day:2,title:'Apologise for a delay',short:'Write one sentence apologising for a late report.',long:'Write 2 to 3 sentences: apologise and say when it will be ready.',
  tr:'To apologise for a delay: "I apologise for the delay." Then say when: "The report will be ready on Friday." Do not use "I was busy" as your only reason.',fu:'Add one more sentence saying exactly when it will be ready.'},
 {n:3,day:3,title:'Explain the problem',short:'Write one sentence saying what went wrong.',long:'Explain the cause of the problem and offer a solution.',
  tr:'Explain the problem in the past: "The system was down, so I could not open the file." Then offer a solution: "I suggest meeting tomorrow."',fu:'Add a solution you could offer.'},
 {n:4,day:4,title:'Message to your manager',short:'Write a 2-sentence message to your manager.',long:'Write a short 5-sentence message: apology, reason, solution, thanks.',
  tr:'A short message to a manager has a greeting, an apology, a reason, a solution and thanks. "Dear Ms Rahal, I apologise for the delay. The file was damaged, so I had to create it again. I will send it tomorrow. Thank you for your patience."',fu:'Check your message: does it have a greeting and a thank-you?'}
];
var DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var DS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var TAGNAME={'past tense':'Past tense','verb pattern':'Verb patterns','spelling':'Spelling','tone':'Tone (too direct or casual)','articles':'Articles','present perfect':'Present perfect','future forms':'Future forms','punctuation':'Capitals and full stops','prepositions':'Prepositions','word choice':'Word choice'};
var TIPS={
 'past tense':'Quick drill: "I forget" becomes "I forgot", "the system was down". Put two lines on a timeline: now and yesterday.',
 'verb pattern':'Pattern board: "I suggest meeting" (not "suggest to meet"); "I had to" (not "I must to").',
 'spelling':'Spelling race on words from this week: tomorrow, apologise, receive.',
 'tone':'Softening: "I want to say sorry" becomes "I would like to apologise". Explain without excuses.',
 'articles':'Short drill on "the delay", "the report", "a problem".',
 'present perfect':'Contrast "I did not send it" with "I have not sent it yet" using the same situation.',
 'future forms':'Promises: "I will send it tomorrow" (not "I send").',
 'punctuation':'Quick reminder: capital "I" and a full stop at the end of every sentence.',
 'prepositions':'Short drill: "sorry for", "delay in", "on Friday", "by tomorrow".',
 'word choice':'Collect the phrases that sounded unnatural and offer natural alternatives together.'
};

/* ---------- sample class (generated for the demo) ---------- */
/* p = how each of the 4 task days went: f full (10 min), t short (2 min), - not done */
var STUDENTS=[
 {name:'Amira',goal:'Write clearer emails to clients',prior:8,p:'ffff',s:[
   ['I am sorry for the late reply. I will send you the file today.',[]],
   ['I apologise for delay with the report. It will be ready on Friday.',['articles']],
   ['Unfortunately the client sent the data late, so we could not finish on time. I suggest to meet tomorrow.',['verb pattern']],
   ['Dear Mr Hassan, I am sorry that the report is late. The data arrived late from the client. I suggest meeting tomorrow to check it together. Thank you for your patience.',[]]]},
 {name:'Yacine',goal:'Speak with more confidence in meetings',prior:8,p:'ftff',s:[
   ['Sorry for the delay. I send the invoice tomorrow.',['future forms']],
   ['Sorry for being late with the report.',[]],
   ['The problem is the system was down yesterday and I can\'t open the file.',['past tense']],
   ['Dear Ms Karim, I am sorry for the delay. The system was down and I could not open the file. I will send it to you tomorrow morning. Best regards.',[]]]},
 {name:'Lina',goal:'Sound more polite and professional',prior:7,p:'fttf',s:[
   ['Please excuse me for the mistake in the email.',[]],
   ['I apologize for the delay, I was busy.',['tone']],
   ['Sorry, I forget to send the file.',['past tense']],
   ['Hello Sir, I want to say sorry because I did not send the file. I had many meetings and I forgot. I will send it today.',['tone']]]},
 {name:'Karim',goal:'Improve accuracy in writing',prior:7,p:'ff-t',s:[
   ['I am sorry for the late answer.',[]],
   ['Sorry for the delay. I did the report but I have not send it.',['present perfect']],
   null,
   ['I am sorry, I will send you the report tomorow.',['spelling']]],
   catchUp:{t:3,text:'The problem is that I lost the file and I must to do it again.',tags:['verb pattern']}},
 {name:'Sofia',goal:'Prepare for an international job',prior:8,p:'tfff',s:[
   ['I am sorry for the confusion.',[]],
   ['I apologise for the delay in sending the report. I have been very busy this week.',[]],
   ['The problem was that the file was corrupt, so I need to create it again.',['past tense']],
   ['Dear Ms Rahal, I apologise for the delay. The file was damaged, so I had to create it again. I will send it to you by tomorow afternoon. Kind regards.',['spelling']]]},
 {name:'Amine',goal:'Handle phone calls in English',prior:6,p:'f---',s:[
   ['I am very sorry for not answering your call yesterday.',[]],null,null,null]}
];

/* ---------- state ---------- */
var KEY='omniloop-v2';
function fresh(){return {role:null,theme:null,view:'dash',day:3,sel:null,contacted:{},auto:{sender:true,feedback:true,summary:true},log:[],session:{day:6,time:'18:00'},tour:true,me:{name:'',goal:'',interest:'',share:true},live:{},extra:[]};}
var S=load();
var flow=null;
var rec=null,recOn=false;
var briefSt={status:'idle',data:null,key:''};
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&typeof o==='object')return Object.assign(fresh(),o);}}catch(e){}return fresh();}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}h^=h>>>16;h=Math.imul(h,2246822507);h^=h>>>13;h=Math.imul(h,3266489909);h^=h>>>16;return (h>>>0)/4294967296;}
function minutes(name,t,k){var h=hash(name+t);return k==='f'?8+Math.floor(h*5):2+Math.floor(h*2);}
function plural(n,a,b){return n===1?a:b;}

function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.add('hide');},2200);}
function copyText(txt,msg){
  function done(){toast(msg||'Copied');}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);return;}}catch(e){}
  fallback();
  function fallback(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);done();}
}

/* ---------- model: everything the dashboard shows comes from here ---------- */
function model(){
  var due=Math.min(S.day,4);
  var rows=studentList().map(function(st){
    var acts=[],done=0,mins=0,t,k,a;
    for(t=1;t<=due;t++){
      k=st.p.charAt(t-1);a={t:t,kind:k,sent:st.s[t-1],min:0,orig:st.o?st.o[t-1]:null};
      if(k!=='-'){a.min=(st.m&&st.m[t-1])||minutes(st.name,t,k);done++;mins+=a.min;}
      acts.push(a);
    }
    var cu=null;
    if(S.day>=5&&st.catchUp){cu=st.catchUp;done++;mins+=7;}
    var quiet=false;
    if(due>=2&&!st.invited){quiet=acts[due-1].kind==='-'&&acts[due-2].kind==='-';}
    var lastDay=-1;
    for(t=due;t>=1;t--){if(acts[t-1].kind!=='-'){lastDay=t;break;}}
    if(cu&&lastDay<5)lastDay=5;
    return {st:st,acts:acts,cu:cu,done:done,mins:mins,quiet:quiet,lastDay:lastDay,
            courseDone:st.prior+done,courseDue:8+due};
  });
  var answers=[];
  rows.forEach(function(r){
    r.acts.forEach(function(a){if(a.kind!=='-'&&a.sent)answers.push({name:r.st.name,t:a.t,kind:a.kind,text:a.sent[0],tags:a.sent[1]});});
    if(r.cu)answers.push({name:r.st.name,t:r.cu.t,kind:'f',text:r.cu.text,tags:r.cu.tags,late:true});
  });
  var tags={};
  answers.forEach(function(a){a.tags.forEach(function(g){
    var o=tags[g]||(tags[g]={tag:g,n:0,names:{},ex:[]});
    o.n++;o.names[a.name]=1;o.ex.push(a);
  });});
  var tl=Object.keys(tags).map(function(g){var o=tags[g];o.k=Object.keys(o.names).length;return o;})
    .sort(function(a,b){return b.n-a.n||b.k-a.k||(a.tag<b.tag?-1:1);});
  var focus=tl.filter(function(o){return o.n>=2;}).slice(0,3);
  var rest=tl.filter(function(o){return focus.indexOf(o)<0;});
  var checks=[
    {label:'Clear apology openings ("sorry for", "I apologise for")',re:/sorry|apologi[sz]e|excuse/i,bad:function(a){return a.tags.indexOf('tone')>=0;}},
    {label:'Giving a reason for the problem',re:/because|\bso\b|the problem|unfortunately|busy|forgot|lost|was down|was damaged|corrupt/i},
    {label:'Offering a solution or next step',re:/\bI will\b|I suggest|will be ready|I had to|need to create|do it again/i}
  ].map(function(c){
    var n=answers.filter(function(a){return c.re.test(a.text)&&!(c.bad&&c.bad(a));}).length;
    return {label:c.label,n:n,of:answers.length};
  }).filter(function(c){return c.of>=4&&c.n/c.of>=0.5;});
  var act=rows.filter(function(r){return !r.st.invited;});
  var dueTotal=act.length*due;
  var doneTotal=act.reduce(function(s,r){return s+Math.min(r.done,due);},0);
  var quiet=rows.filter(function(r){return r.quiet;});
  var courseDone=act.reduce(function(s,r){return s+r.courseDone;},0);
  var courseDue=act.length*(8+due);
  return {due:due,rows:rows,act:act,answers:answers,tags:tl,focus:focus,rest:rest,checks:checks,
    dueTotal:dueTotal,doneTotal:doneTotal,quiet:quiet,courseDone:courseDone,courseDue:courseDue};
}
function todayState(r){
  var d=S.day,k=dayKind(d);
  if(r.st.invited&&!r.done)return {t:'Invited',c:''};
  if(k==='task'){var c=r.acts[d-1].kind;return c==='f'?{t:'Done (10 min)',c:'ok'}:c==='t'?{t:'Done (2 min)',c:'warn'}:{t:'Not yet',c:'bad'};}
  if(k==='rest')return {t:'Rest day',c:''};
  if(k==='cheat')return r.cu?{t:'Caught up',c:'ok'}:{t:'Cheat day',c:''};
  return {t:'Live session',c:''};
}
function moodOf(r){
  var d=Math.min(S.day,4),i;
  for(i=d;i>=1;i--){var c=r.acts[i-1].kind;if(c==='f')return {t:'Good',c:'ok',d:i};if(c==='t')return {t:'Tired',c:'warn',d:i};}
  return {t:'No check-in',c:'',d:0};
}
function lastLabel(r){
  if(r.st.invited&&r.lastDay<0)return 'Invited';
  if(r.lastDay<0)return S.day===0?'New week':'No activity yet';
  var diff=S.day-r.lastDay;
  return diff<=0?'Today':diff===1?'Yesterday':DN[r.lastDay];
}
function dots(r){
  var out='',d,cls,txt;
  for(d=0;d<7;d++){
    if(d===0){cls='r';txt='';}
    else if(d<=4){
      if(d>Math.min(S.day,4)){cls='';txt='';}
      else{var k=r.acts[d-1].kind;cls=k==='f'?'f':k==='t'?'t':(r.st.invited?'':'m');txt='';}
    }
    else if(d===5){cls=(S.day>=5&&r.cu)?'f':'';}
    else{cls='l';txt='';}
    out+='<span class="dot '+cls+'" title="'+DN[d]+'">'+DS[d].charAt(0)+'</span>';
  }
  return '<span class="dots" role="img" aria-label="Week at a glance">'+out+'</span>';
}
function legend(){
  return '<div class="legend"><span><span class="dot f"></span>10-minute task</span><span><span class="dot t"></span>2-minute task</span><span><span class="dot m"></span>missed</span><span><span class="dot r"></span>rest day</span><span><span class="dot l"></span>live session</span></div>';
}
function draftFor(r){
  var first=r.st.name;
  var last=r.lastDay>=0?DN[r.lastDay]:null;
  var a=last?'we haven\'t heard from you since '+last+'.':'we haven\'t heard from you yet this week.';
  return 'Hi '+first+', '+a+' No pressure: every task has a 2-minute version, and one sentence is enough. I will see you at the live session on '+DN[S.session.day]+' at '+S.session.time+'.';
}

function requestBrief(m){

  function once(){
    var ctl=typeof AbortController!=='undefined'?new AbortController():null,timer=setTimeout(function(){if(ctl)ctl.abort();},25000);
    return fetch(AI_URL+'brief',{method:'POST',headers:{'Content-Type':'application/json'},body:payload,signal:ctl?ctl.signal:undefined})
      .then(function(r){return r.json();})
      .then(function(d){clearTimeout(timer);if(!d||!d.ok||!Array.isArray(d.focus)||!d.focus.length)throw new Error('bad');
        var texts=m.answers;
        d.focus=d.focus.map(function(f){f.evidence=(f.evidence||[]).filter(function(e){return texts.some(function(a){return a.name===e.name&&a.text.indexOf(e.quote)>=0;});});return f;}).filter(function(f){return f.evidence.length;});
        if(!d.focus.length)throw new Error('no evidence');
        d.brief=d.brief||[];d.outline=d.outline||[];d.personal=d.personal||[];
        return d;})
      .catch(function(e){clearTimeout(timer);throw e;});
  }
  return once().catch(function(){return once();});
}

var SNAV=[['today','home','Today'],['mycourse','book','My course'],['profile','users','My profile'],['library','lock','Library'],['chats','lock','Chats']];

/* Simple feedback rules. Clearly labelled as simulated in the interface. */
var SPELL={tomorow:'tomorrow',tommorow:'tomorrow',tommorrow:'tomorrow',recieve:'receive',aplogize:'apologize',aplogise:'apologise',appologize:'apologize',appologise:'apologise',apologyze:'apologize',sory:'sorry',definately:'definitely',seperate:'separate',untill:'until',beleive:'believe'};
var RULES=[
 {tag:'tone',re:/\bI want to say sorry\b/i,msg:'This sounds a little casual for work. Try "I would like to apologise".',fix:function(t){return t.replace(/I want to say sorry/i,'I would like to apologise');}},
 {tag:'tone',re:/\bI was busy\b/i,msg:'"I was busy" can sound like an excuse. Say what happened and what you will do.',fix:function(t){return t.replace(/,?\s*(because\s+)?I was busy/i,'');}},
 {tag:'tone',re:/\b(give me|you must|I need you to)\b/i,msg:'This sounds too direct. Try "Could you..." or "Would it be possible to...".',fix:null},
 {tag:'past tense',re:/\bI forget\b/i,msg:'Use the past simple for something that already happened: "I forgot".',fix:function(t){return t.replace(/\bI forget\b/i,'I forgot');}},
 {tag:'past tense',re:/\b(can't|cannot|can not)\b[^.]*\b(yesterday|last night)\b|\b(yesterday|last night)\b[^.]*\b(can't|cannot|can not)\b/i,msg:'For a past problem use "could not", not "can\'t".',fix:function(t){return t.replace(/\b(can't|cannot|can not)\b/i,'could not');}},
 {tag:'past tense',re:/\bI (send|lose|miss|do|make)\b[^.]*\b(yesterday|last night|last week)\b/i,msg:'Use the past simple for yesterday: "I sent", "I lost", "I missed".',fix:null},
 {tag:'verb pattern',re:/\bsuggest to\b/i,msg:'After "suggest" use the -ing form: "I suggest meeting".',fix:function(t){return t.replace(/suggest to meet/i,'suggest meeting');}},
 {tag:'verb pattern',re:/\bmust to\b/i,msg:'Say "I had to" or "I must", never "must to".',fix:function(t){return t.replace(/\bI must to\b/i,'I had to');}},
 {tag:'present perfect',re:/\b(have|has) not send\b|\bhave send\b/i,msg:'After "have" use the past participle: "have not sent".',fix:function(t){return t.replace(/not send\b/i,'not sent');}},
 {tag:'future forms',re:/\bI send\b[^.]*\b(tomorrow|tomorow|today|later|soon|next)\b/i,msg:'For a promise use "will": "I will send it tomorrow".',fix:function(t){return t.replace(/\bI send\b/i,'I will send');}},
 {tag:'articles',re:/\bfor delay\b|\bwith report\b|\bsend report\b|\bin report\b/i,msg:'Add "the": "for the delay", "the report".',fix:function(t){return t.replace(/\bfor delay\b/i,'for the delay').replace(/\bwith report\b/i,'with the report').replace(/\bsend report\b/i,'send the report');}},
 {tag:'spelling',re:new RegExp('\\b('+Object.keys(SPELL).join('|')+')\\b','i'),msg:function(m){return 'Check the spelling of "'+m[1]+'": it is "'+SPELL[m[1].toLowerCase()]+'".';},fix:function(t){return t.replace(new RegExp('\\b('+Object.keys(SPELL).join('|')+')\\b','gi'),function(w){return SPELL[w.toLowerCase()];});}},
 {tag:'punctuation',re:/(^|\s)i(?=[\s,.'])/,msg:'Write the word "I" with a capital letter.',fix:function(t){return t.replace(/(^|\s)i(?=[\s,.'])/g,'$1I');}},
 {tag:'punctuation',test:function(t){return /[A-Za-z0-9]\s*$/.test(t)?[''] :null;},msg:'End your sentence with a full stop.',fix:function(t){return t.replace(/\s*$/,'.');}}
];
function review(text){
  var t=text.trim();
  if(t.split(/\s+/).filter(Boolean).length<3)return {err:'Write at least one full sentence (3 words or more).'};
  var fixes=[],improved=t,i,r,m;
  for(i=0;i<RULES.length;i++){
    r=RULES[i];m=r.test?r.test(t):t.match(r.re);
    if(m){fixes.push({tag:r.tag,msg:typeof r.msg==='function'?r.msg(m):r.msg,fix:r.fix});}
  }
  fixes=fixes.slice(0,2);
  fixes.forEach(function(f){if(f.fix)improved=f.fix(improved);});
  var tags=[];fixes.forEach(function(f){if(tags.indexOf(f.tag)<0)tags.push(f.tag);});
  var good;
  if(/sorry|apologi[sz]e|excuse/i.test(t)&&tags.indexOf('tone')<0)good='You apologised clearly.';
  else if(/because|\bso\b|the problem|unfortunately|was down|was damaged|lost|forgot/i.test(t))good='You gave a reason for the problem.';
  else if(/\bI will\b|I suggest|will be ready/i.test(t))good='You offered a next step.';
  else good='You wrote a clear answer. Thank you for practising today.';
  return {good:good,fixes:fixes.map(function(f){return {tag:f.tag,msg:f.msg};}),tags:tags,improved:improved!==t?improved:null};
}

function getFeedback(text,t,kind){
  var rules=review(text);
  if(!AI_URL||S.auto.feedback===false)return Promise.resolve(Object.assign({source:'rules'},rules));
  function once(){
    var ctl=typeof AbortController!=='undefined'?new AbortController():null;
    var timer=setTimeout(function(){if(ctl)ctl.abort();},12000);
    return fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,task:t,kind:kind}),signal:ctl?ctl.signal:undefined})
      .then(function(r){return r.json();})
      .then(function(d){clearTimeout(timer);
        if(!d||!d.ok||!Array.isArray(d.fixes))throw new Error('bad');
        return {source:'ai',good:d.good,fixes:d.fixes,tags:d.tags||[],improved:d.improved||null,follow:d.follow||''};})
      .catch(function(e){clearTimeout(timer);throw e;});
  }
  /* one automatic retry, then the simple rules */
  return once().catch(function(){return once();}).catch(function(){return Object.assign({source:'rules'},rules);});
}

function toggleVoice(){
  var ta=document.getElementById('ans');
  if(!ta||!SR())return;
  if(recOn){stopVoice();return;}
  var base=ta.value.trim();base=base?base+' ':'';
  var finalT='';
  rec=new (SR())();rec.lang='en-US';rec.interimResults=true;rec.continuous=true;
  rec.onresult=function(e){
    var interim='',i,r;
    for(i=e.resultIndex;i<e.results.length;i++){r=e.results[i];if(r.isFinal)finalT+=r[0].transcript+' ';else interim+=r[0].transcript;}
    var el=document.getElementById('ans');
    if(el){el.value=(base+finalT+interim).replace(/\s+/g,' ').replace(/^\s+/,'');if(flow)flow.text=el.value;}
  };
  rec.onerror=function(e){
    var m=document.getElementById('voicemsg');
    if(m)m.textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'Microphone access was blocked. Allow the microphone in your browser, or type your answer.':'Voice input stopped ('+e.error+'). You can type instead.';
  };
  rec.onend=function(){
    recOn=false;
    var b=document.getElementById('voicebtn'),m=document.getElementById('voicemsg');
    if(b)b.textContent='Speak your answer';
    if(m&&m.textContent.indexOf('Listening')===0)m.textContent='Check the text, fix anything, then get feedback. Speech does not add full stops.';
  };
  try{
    rec.start();recOn=true;
    var b=document.getElementById('voicebtn'),m=document.getElementById('voicemsg');
    if(b)b.textContent='Stop listening';
    if(m)m.textContent='Listening... speak in English.';
  }catch(e){recOn=false;}
}

  var dk=dayKind(S.day);
  h+='<div class="democlock"><div><b>Demo day: '+DN[S.day]+'</b><span>'+esc(dayRole(S.day))+(dk==='task'?': '+esc(TASKS[S.day-1].title):'')+'</span></div>'
   +'<div class="btns"><button class="btn sm" data-a="day" data-d="-1" aria-label="Previous day"'+(S.day<=0?' disabled':'')+'>'+ico('left')+'</button><button class="btn sm" data-a="day" data-d="1" aria-label="Next day"'+(S.day>=6?' disabled':'')+'>'+ico('right')+'</button></div></div>'
   +'<button class="linkbtn" style="color:var(--mute)" data-a="reset">Reset my demo answers</button>';
  return h+'</aside>';
}

/* ---------- render ---------- */
function applyTheme(){var r=document.documentElement;if(S.theme)r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme');}
function render(){
  applyTheme();
  var app=document.getElementById('app');
  if(!S.role){app.innerHTML=vLanding();return;}
  var m=model(),body;
  if(S.role==='student'){
    switch(S.view){
      case 'mycourse':body=vMyCourse();break;
      case 'profile':body=vProfile();break;
      case 'library':body=vLibrary();break;
      case 'chats':body=vChats();break;
      default:body=vToday();
    }
    app.innerHTML='<div class="app">'+sidebar()+'<main class="main" id="main">'+body+'</main>'+railStudent()+'</div>';
    return;
  }
  switch(S.view){
    case 'course':body=vCourse();break;
    case 'students':body=vStudents(m);break;
    case 'report':body=vReport(m);break;
    case 'assist':body=vAssist(m);break;
    case 'library':body=vLibrary();break;
    default:body=vDash(m);
  }
  app.innerHTML='<div class="app">'+sidebar()+'<main class="main" id="main">'+body+'</main>'+railHtml(m)+'</div>';
}

/* ---------- actions ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;
  var a=b.getAttribute('data-a'),d=b.dataset,m;
  if(a==='enter'){S.role=d.r;S.view=d.r==='student'?'today':'dash';S.sel=null;flow=null;}
  else if(a==='exit'){S.role=null;flow=null;}
  else if(a==='switch'){S.role=S.role==='teacher'?'student':'teacher';S.view=S.role==='student'?'today':'dash';S.sel=null;flow=null;}
  else if(a==='mood'){var tt=flow?flow.t:S.day;flow={t:tt,mood:d.m,kind:d.m==='tired'?'t':'f',step:'valid',text:''};}
  else if(a==='catch'){flow={t:parseInt(d.t,10),step:'mood',text:''};}
  else if(a==='begin'){flow.step='task';flow.start=Date.now();}
  else if(a==='submit'){
    if(flow.busy)return;
    stopVoice();
    var el=document.getElementById('ans');flow.text=el?el.value:flow.text;
    if(flow.text.trim().split(/\s+/).filter(Boolean).length<3){flow.err='Write at least one full sentence (3 words or more).';render();return;}
    flow.err=null;flow.busy=true;render();
    var f0=flow,txt0=flow.text.trim();
    getFeedback(txt0,f0.t,f0.kind).then(function(res){
      if(flow!==f0)return;
      var old=S.live[f0.t],el2=Math.max(1,Math.round((Date.now()-(f0.start||Date.now()))/60000));
      S.live[f0.t]={kind:f0.kind,mood:f0.mood,orig:old?old.orig:txt0,text:txt0,tags:res.tags,fixes:res.fixes,revised:!!old,source:res.source,min:old?Math.max(old.min,el2):el2};
      f0.fb=res;f0.step='fb';f0.busy=false;save();render();
    });
    return;
  }
  else if(a==='revise'){var e0=S.live[d.t];flow={t:parseInt(d.t,10),mood:e0.mood,kind:e0.kind,step:'task',text:e0.text,start:Date.now()};}
  else if(a==='finish'){flow=null;}
  else if(a==='share'){S.me.share=!S.me.share;}
  else if(a==='reset'){S=Object.assign(fresh(),{role:S.role,theme:S.theme,view:S.role==='student'?'today':'dash'});flow=null;briefSt={status:'idle',data:null,key:''};}
  else if(a==='nav'){S.view=d.v;S.sel=null;}
  else if(a==='theme'){S.theme=d.t;}
  else if(a==='open'){S.view='students';S.sel=d.n||null;}
  else if(a==='hidetour'){S.tour=false;}
  else if(a==='day'){S.day=Math.max(0,Math.min(6,S.day+parseInt(d.d,10)));}
  else if(a==='toggle'){S.auto[d.k]=!S.auto[d.k];}
  else if(a==='contact'){S.contacted[d.n]=S.day;S.log=S.log.concat([{day:S.day,who:'You',text:'Marked the message to '+d.n+' as sent.'}]);}
  else if(a==='copydraft'){m=model();var r=m.rows.filter(function(x){return x.st.name===d.n;})[0];if(r){copyText(draftFor(r),'Message copied');}return;}
  else if(a==='copyreport'){copyText(reportText(model()),'Brief copied');return;}
  else if(a==='copyai'){m=model();if(briefSt.status==='done')copyText(aiText(briefSt.data,m),'AI brief copied');return;}
  else if(a==='dlbrief'){m=model();download('omniloop-lesson-brief.txt',(briefSt.status==='done'&&briefSt.key===aiKey(m))?aiText(briefSt.data,m):reportText(m));return;}
  else if(a==='aibrief'){
    if(briefSt.status==='loading')return;
    m=model();var k0=aiKey(m);briefSt={status:'loading',data:null,key:k0};render();
    requestBrief(m).then(function(d){briefSt={status:'done',data:d,key:k0};render();},function(){briefSt={status:'error',data:null,key:k0};render();});
    return;
  }
  else if(a==='voice'){toggleVoice();return;}
  else if(a==='listen'){var tk=flow?TASKS[flow.t-1]:null;if(d.w==='improved'&&flow&&flow.fb&&flow.fb.improved)listen(flow.fb.improved);else if(tk)listen(tk.tr);return;}
  else if(a==='addstudent'){
    var nm=(document.getElementById('add-name')||{}).value||'',gl=(document.getElementById('add-goal')||{}).value||'';
    nm=nm.trim();
    if(!nm){toast('Type the student\'s name first.');return;}
    var dup=studentList().some(function(x){return x.name.toLowerCase()===nm.toLowerCase();});
    if(dup){toast('That name is already in the class.');return;}
    S.extra.push({name:nm,goal:gl.trim(),code:makeCode()});toast(nm+' added. Invite code created.');
  }
  else if(a==='copyinvite'){var ex=S.extra.filter(function(x){return x.name===d.n;})[0];if(ex)copyText('Join my Omniloop class: '+inviteLink(ex.code)+' (code '+ex.code+')','Invite copied');return;}
  else if(a==='rmstudent'){S.extra=S.extra.filter(function(x){return x.name!==d.n;});}
  else return;
  save();render();
  if(a==='nav'||a==='open'||a==='enter'){window.scrollTo(0,0);}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='ans'&&flow){flow.text=el.value;}
  else if(el.id==='pf-name'){S.me.name=el.value;save();}
  else if(el.id==='pf-goal'){S.me.goal=el.value;save();}
  else if(el.id==='pf-int'){S.me.interest=el.value;save();}
});
document.addEventListener('change',function(e){
  var s=e.target.closest('select[data-a]');if(!s)return;
  var a=s.getAttribute('data-a');
  if(a==='resday')S.session.day=parseInt(s.value,10);
  else if(a==='restime')S.session.time=s.value;
  else return;
  S.log=S.log.concat([{day:S.day,who:'Task Sender',text:'Told students the live session is now '+sessionLabel()+' (simulated).'}]);
  save();render();toast('Live session moved to '+sessionLabel());
});
render();
})();
</script>
</body>
</html>
